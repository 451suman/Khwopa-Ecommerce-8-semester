{% load static %}
<!-- SIMPLE FULL HEADER WITH LOGIN/LOGOUT START -->
<header style="font-family:sans-serif;">

  <!-- Top Header -->
  <div style="background:#111; color:#fff; font-size:14px; padding:8px 0;">
    <div style="max-width:1100px; margin:auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
      
      <!-- Left: Contact Info -->
      <div style="display:flex; gap:15px; flex-wrap:wrap;">
        <span>📞 +019 (111) 25184203</span>
        <span>✉️ KhwopaAuthenticate@gmail.com</span>
      </div>
      
      <!-- Right: Search -->
      {% include 'customer/navbar/search.html' %}
    </div>
  </div>

  <!-- Main Navbar -->
  <div style="background:#222; color:#fff; padding:12px 0;">
    <div style="max-width:1100px; margin:auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;">
      
      <!-- Left: Logo -->
      <a href="{% url 'home' %}" style="text-decoration:none; color:#fff; font-size:20px; font-weight:bold;">
        <img src="{% static 'customer/images/logo.png' %}" alt="Logo" style="height:40px; vertical-align:middle;"> 
      </a>

      <!-- Center: Navigation Links -->
      <nav style="flex:1; text-align:center;">
        <ul style="list-style:none; display:inline-flex; padding:0; margin:0;">
          <li><a href="{% url 'home' %}" style="color:#fff; text-decoration:none; margin:0 15px;">Home</a></li>
          <li><a href="{% url 'product_list' %}" style="color:#fff; text-decoration:none; margin:0 15px;">Products</a></li>
          <li><a href="{% url 'my-cart' %}" style="color:#fff; text-decoration:none; margin:0 15px;">Cart</a></li>
          <li><a href="{% url 'order-list' %}" style="color:#fff; text-decoration:none; margin:0 15px;">Orders</a></li>
        </ul>
      </nav>

      <!-- Right: Login / Logout Buttons -->
      <div style="display:flex; gap:10px;">
        {% if user.is_authenticated %}
          <a href="{% url 'customer_logout' %}" style="background:#ff6600; color:#fff; padding:6px 12px; border-radius:4px; text-decoration:none;">Logout</a>
        {% else %}
          <a href="{% url 'customer_login' %}" style="background:#ff6600; color:#fff; padding:6px 12px; border-radius:4px; text-decoration:none;">Login</a>
          <a href="{% url 'customer_signup' %}" style="background:#555; color:#fff; padding:6px 12px; border-radius:4px; text-decoration:none;">Signup</a>
        {% endif %}
      </div>

    </div>
  </div>
</header>
<!-- SIMPLE FULL HEADER WITH LOGIN/LOGOUT END -->
