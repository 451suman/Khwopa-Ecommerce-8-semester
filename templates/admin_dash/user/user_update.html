{% extends 'admin_dash/base.html' %}
{% block content %}

<div class="card">
    <div class="card-header">
        <h4>Edit User: {{ object.full_name }}</h4>
    </div>

    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-danger small">{{ field.errors|first }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'user_list_admin' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

</div>

{% endblock %}
