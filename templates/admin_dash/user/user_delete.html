{% extends 'admin_dash/base.html' %}
{% block content %}

<div class="card">
    <div class="card-body text-center">

        <h4>Delete User</h4>
        <p>Are you sure you want to delete <strong>{{ object.full_name }}</strong> ({{ object.email }})?</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'user_list_admin' %}" class="btn btn-secondary">Cancel</a>
        </form>

    </div>
</div>

{% endblock %}
