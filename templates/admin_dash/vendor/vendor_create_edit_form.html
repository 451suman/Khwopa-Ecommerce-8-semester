{% extends 'admin_dash/base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<div class="card">
    <div class="card-body">
        <h4>Create Vendor</h4>
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <h5>User Information</h5>
            {{ user_form|crispy }}

            <h5>Vendor Details</h5>
            {{ vendor_form|crispy }}

            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

{% endblock content %}
