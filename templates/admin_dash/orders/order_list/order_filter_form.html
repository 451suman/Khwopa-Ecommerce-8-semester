<!-- FILTER TOGGLE BUTTON -->
<p class="d-inline-flex gap-2 mb-3">
    <button class="btn btn-primary"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#vendorFilterCollapse"
            aria-expanded="false"
            aria-controls="vendorFilterCollapse">
        <i class="bi bi-funnel"></i> Filters
    </button>
</p>

<!-- COLLAPSIBLE FILTER CARD -->
<div class="collapse" id="vendorFilterCollapse">
    <div class="card shadow-sm border-primary">
        <div class="card-body">
            <form action="{% url 'admin_order_filtered_list' %}" method="get" class="row g-3 align-items-center">
                <!-- Search field -->
                <div class="col-md-9">
                    <div class="form-floating">
                        <input type="text"
                               name="search"
                               class="form-control"
                               id="searchInput"
                               placeholder="Search by order_number, email, or mobile..."
                               value="{{ search_query }}">
                        <label for="searchInput">Search</label>
                    </div>
                </div>
                
                <!-- Apply button -->
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary">Filter</button>
                </div>
            </form>
        </div>
    </div>
</div>
